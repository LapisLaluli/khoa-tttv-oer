<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Blur filter for atmospheric depth of field -->
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
    </filter>
    
    <filter id="deepBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="16" result="heavyBlur"/>
    </filter>

    <!-- Warm Ambient Gradients -->
    <linearGradient id="hallGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180407"/>
      <stop offset="35%" stop-color="#320c14"/>
      <stop offset="70%" stop-color="#24070e"/>
      <stop offset="100%" stop-color="#120205"/>
    </linearGradient>

    <radialGradient id="lampGlow1" cx="30%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#e8b86d" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#c88a38" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lampGlow2" cx="78%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#ffd599" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#d49244" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bookSpineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a1620"/>
      <stop offset="50%" stop-color="#8a2a38"/>
      <stop offset="100%" stop-color="#4a0f18"/>
    </linearGradient>

    <linearGradient id="bookSpineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b6528"/>
      <stop offset="50%" stop-color="#cba153"/>
      <stop offset="100%" stop-color="#694a1b"/>
    </linearGradient>
    
    <linearGradient id="bookSpineGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c2f48"/>
      <stop offset="50%" stop-color="#2c4b72"/>
      <stop offset="100%" stop-color="#132236"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="1920" height="1080" fill="url(#hallGradient)"/>

  <!-- LIBRARY ARCHITECTURE & BOOKCASES (Atmospheric & Soft Blurred) -->
  <g filter="url(#softBlur)" opacity="0.65">
    <!-- Grand Classical Archways -->
    <path d="M 0,0 L 0,1080 L 350,1080 L 350,550 Q 500,200 650,550 L 650,1080 L 1270,1080 L 1270,550 Q 1420,200 1570,550 L 1570,1080 L 1920,1080 L 1920,0 Z" fill="#1f070b" opacity="0.4"/>
    <path d="M 680,1080 L 680,600 Q 960,180 1240,600 L 1240,1080 Z" fill="#2d0a11" opacity="0.25"/>

    <!-- Left Library Bookshelves -->
    <g transform="translate(60, 120)">
      <!-- Shelf Frame -->
      <rect x="0" y="0" width="380" height="900" fill="#22070c" stroke="#42131b" stroke-width="6"/>
      <!-- Horizontal Shelves -->
      <line x1="0" y1="180" x2="380" y2="180" stroke="#754b20" stroke-width="12"/>
      <line x1="0" y1="360" x2="380" y2="360" stroke="#754b20" stroke-width="12"/>
      <line x1="0" y1="540" x2="380" y2="540" stroke="#754b20" stroke-width="12"/>
      <line x1="0" y1="720" x2="380" y2="720" stroke="#754b20" stroke-width="12"/>

      <!-- Shelf 1 Books -->
      <rect x="15" y="40" width="28" height="140" fill="url(#bookSpineGrad1)" rx="2"/>
      <rect x="46" y="30" width="34" height="150" fill="url(#bookSpineGrad2)" rx="2"/>
      <rect x="83" y="50" width="24" height="130" fill="url(#bookSpineGrad3)" rx="2"/>
      <rect x="110" y="25" width="38" height="155" fill="url(#bookSpineGrad1)" rx="2"/>
      <rect x="151" y="45" width="30" height="135" fill="url(#bookSpineGrad2)" rx="2"/>
      <rect x="184" y="35" width="26" height="145" fill="url(#bookSpineGrad3)" rx="2"/>
      <rect x="213" y="55" width="36" height="125" fill="url(#bookSpineGrad1)" rx="2"/>
      <rect x="252" y="20" width="32" height="160" fill="url(#bookSpineGrad2)" rx="2"/>
      <rect x="287" y="40" width="40" height="140" fill="url(#bookSpineGrad3)" rx="2"/>
      <rect x="330" y="30" width="35" height="150" fill="url(#bookSpineGrad1)" rx="2"/>

      <!-- Shelf 2 Books -->
      <rect x="15" y="210" width="35" height="150" fill="url(#bookSpineGrad2)" rx="2"/>
      <rect x="53" y="225" width="28" height="135" fill="url(#bookSpineGrad3)" rx="2"/>
      <rect x="84" y="200" width="42" height="160" fill="url(#bookSpineGrad1)" rx="2"/>
      <rect x="129" y="220" width="30" height="140" fill="url(#bookSpineGrad2)" rx="2"/>
      <rect x="162" y="205" width="36" height="155" fill="url(#bookSpineGrad3)" rx="2"/>
      <rect x="201" y="230" width="25" height="130" fill="url(#bookSpineGrad1)" rx="2"/>
      <rect x="229" y="210" width="38" height="150" fill="url(#bookSpineGrad2)" rx="2"/>
      <rect x="270" y="195" width="34" height="165" fill="url(#bookSpineGrad1)" rx="2"/>
      <rect x="307" y="215" width="32" height="145" fill="url(#bookSpineGrad3)" rx="2"/>
      <rect x="342" y="225" width="24" height="135" fill="url(#bookSpineGrad2)" rx="2"/>

      <!-- Shelf 3 Books -->
      <rect x="15" y="390" width="40" height="150" fill="url(#bookSpineGrad3)" rx="2"/>
      <rect x="58" y="410" width="32" height="130" fill="url(#bookSpineGrad1)" rx="2"/>
      <rect x="93" y="380" width="36" height="160" fill="url(#bookSpineGrad2)" rx="2"/>
      <rect x="132" y="400" width="28" height="140" fill="url(#bookSpineGrad3)" rx="2"/>
      <rect x="163" y="385" width="44" height="155" fill="url(#bookSpineGrad1)" rx="2"/>
      <rect x="210" y="405" width="30" height="135" fill="url(#bookSpineGrad2)" rx="2"/>
      <rect x="243" y="390" width="38" height="150" fill="url(#bookSpineGrad3)" rx="2"/>
      <rect x="284" y="415" width="26" height="125" fill="url(#bookSpineGrad1)" rx="2"/>
      <rect x="313" y="395" width="52" height="145" fill="url(#bookSpineGrad2)" rx="2"/>
    </g>

    <!-- Right Library Bookshelves -->
    <g transform="translate(1480, 100)">
      <!-- Shelf Frame -->
      <rect x="0" y="0" width="380" height="920" fill="#22070c" stroke="#42131b" stroke-width="6"/>
      <!-- Shelves -->
      <line x1="0" y1="180" x2="380" y2="180" stroke="#754b20" stroke-width="12"/>
      <line x1="0" y1="360" x2="380" y2="360" stroke="#754b20" stroke-width="12"/>
      <line x1="0" y1="540" x2="380" y2="540" stroke="#754b20" stroke-width="12"/>
      <line x1="0" y1="720" x2="380" y2="720" stroke="#754b20" stroke-width="12"/>

      <!-- Books Row 1 -->
      <rect x="15" y="30" width="36" height="150" fill="url(#bookSpineGrad2)" rx="2"/>
      <rect x="54" y="45" width="28" height="135" fill="url(#bookSpineGrad1)" rx="2"/>
      <rect x="85" y="20" width="40" height="160" fill="url(#bookSpineGrad3)" rx="2"/>
      <rect x="128" y="35" width="32" height="145" fill="url(#bookSpineGrad2)" rx="2"/>
      <rect x="163" y="50" width="26" height="130" fill="url(#bookSpineGrad1)" rx="2"/>
      <rect x="192" y="25" width="38" height="155" fill="url(#bookSpineGrad3)" rx="2"/>
      <rect x="233" y="40" width="34" height="140" fill="url(#bookSpineGrad2)" rx="2"/>
      <rect x="270" y="15" width="42" height="165" fill="url(#bookSpineGrad1)" rx="2"/>
      <rect x="315" y="35" width="30" height="145" fill="url(#bookSpineGrad3)" rx="2"/>

      <!-- Books Row 2 -->
      <rect x="15" y="200" width="42" height="160" fill="url(#bookSpineGrad1)" rx="2"/>
      <rect x="60" y="220" width="30" height="140" fill="url(#bookSpineGrad2)" rx="2"/>
      <rect x="93" y="205" width="35" height="155" fill="url(#bookSpineGrad3)" rx="2"/>
      <rect x="131" y="225" width="28" height="135" fill="url(#bookSpineGrad1)" rx="2"/>
      <rect x="162" y="195" width="40" height="165" fill="url(#bookSpineGrad2)" rx="2"/>
      <rect x="205" y="215" width="32" height="145" fill="url(#bookSpineGrad3)" rx="2"/>
      <rect x="240" y="230" width="26" height="130" fill="url(#bookSpineGrad1)" rx="2"/>
      <rect x="269" y="210" width="36" height="150" fill="url(#bookSpineGrad2)" rx="2"/>
      <rect x="308" y="200" width="38" height="160" fill="url(#bookSpineGrad1)" rx="2"/>
    </g>

    <!-- Center Gallery Reading Hall Pillars & Light Windows -->
    <g opacity="0.35">
      <rect x="740" y="280" width="80" height="800" fill="#380e15"/>
      <rect x="1100" y="280" width="80" height="800" fill="#380e15"/>
      <polygon points="700,280 740,250 820,250 860,280" fill="#581622"/>
      <polygon points="1060,280 1100,250 1180,250 1220,280" fill="#581622"/>
    </g>
  </g>

  <!-- ATMOSPHERIC LIGHTING & GLOW LAYERS -->
  <rect width="1920" height="1080" fill="url(#lampGlow1)"/>
  <rect width="1920" height="1080" fill="url(#lampGlow2)"/>

  <!-- Subtle Floating Dust / Bokeh Knowledge Particles -->
  <g opacity="0.4" filter="url(#softBlur)">
    <circle cx="450" cy="320" r="18" fill="#ffe0a3" opacity="0.3"/>
    <circle cx="820" cy="220" r="28" fill="#ffd185" opacity="0.2"/>
    <circle cx="1150" cy="380" r="22" fill="#ffd994" opacity="0.25"/>
    <circle cx="1380" cy="260" r="16" fill="#ffe8be" opacity="0.35"/>
    <circle cx="950" cy="520" r="32" fill="#d49244" opacity="0.15"/>
    <circle cx="620" cy="650" r="20" fill="#ffd599" opacity="0.2"/>
    <circle cx="1600" cy="480" r="24" fill="#ffd994" opacity="0.25"/>
  </g>

  <!-- Elegant Center Watermark Typography -->
  <text x="960" y="560" font-family="'Lora', 'Georgia', serif" font-size="32" letter-spacing="8" fill="#d4af37" opacity="0.08" text-anchor="middle" font-weight="700">FLIS OER · KHOA THÔNG TIN THƯ VIỆN</text>
</svg>
